; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:CosmoChip]
platform = espressif32
board = CosmoChip
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
build_src_flags = -Wextra -Werror
check_tool = clangtidy
check_flags = clangtidy: --config-file=./.clang-tidy
check_skip_packages = yes
lib_deps =
    https://github.com/STMicroelectronics/lsm6dso-pid.git # LSM6DSO driver
    https://github.com/boschsensortec/BME280_SensorAPI.git # official BME280 driver

